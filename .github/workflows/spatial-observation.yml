name: Spatial observation contract (synthetic candidate)
on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/SPATIAL_OBSERVATION_CONTRACT.md'
      - '.github/workflows/spatial-observation.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'docs/SPATIAL_OBSERVATION_CONTRACT.md'
      - '.github/workflows/spatial-observation.yml'
permissions:
  contents: read
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node built-in synthetic contract tests
        run: node --test contracts/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned independent schema validator
        run: python -m pip install 'jsonschema[format]==4.23.0'
      - name: Validate shared fixtures against Draft 2020-12
        run: python -m unittest discover -s contracts -p 'test_spatial_*.py' -v
