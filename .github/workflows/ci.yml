name: Acoustic-mesh CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run typecheck

      - name: Production build
        run: bun run build

  evidence-boundary:
    name: Evidence Boundary Check
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public evidence markers
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f GOVERNANCE.md
          test -f CONTRIBUTING.md
          test -f NOTICE
          test -f .github/pull_request_template.md
          test -d .github/ISSUE_TEMPLATE
          grep -q "Experimental engineering" README.md
          grep -q "project-local" GOVERNANCE.md

          if grep -R -Eqi \
            'meta-orchestrated by[[:space:]]+\*\*?Agent Amethyst|governed under[[:space:]]+the.*DGAF|production-grade multi-device acoustic mesh|Governed by.*DGAF-Framework' \
            CONTRIBUTING.md NOTICE .github/pull_request_template.md .github/ISSUE_TEMPLATE; then
            echo "Stale cross-repository authority or production claim found in a current-facing contribution surface." >&2
            exit 1
          fi

          echo "Public evidence-boundary markers present and stale authority phrases absent."
