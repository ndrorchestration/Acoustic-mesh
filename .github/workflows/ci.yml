name: Acoustic-mesh CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript type check
        run: bun run typecheck

      - name: Production build
        run: bun run build

  evidence-boundary:
    name: Evidence Boundary Check
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify public evidence markers
        run: |
          test -f README.md
          test -f GOVERNANCE.md
          grep -q "Experimental engineering" README.md
          grep -q "project-local" GOVERNANCE.md
          echo "Public evidence-boundary markers present."
